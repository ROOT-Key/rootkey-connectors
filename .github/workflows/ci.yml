name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  functions:
    name: "${{ matrix.connector.name }} — typecheck / test / build"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        connector:
          - name: aws-s3 lambda
            slug: aws-s3-lambda
            path: aws-s3/lambda
          - name: onedrive function
            slug: onedrive-function
            path: onedrive/function
          - name: sharepoint function
            slug: sharepoint-function
            path: sharepoint/function
          - name: r2 worker
            slug: r2-worker
            path: r2/worker

    defaults:
      run:
        working-directory: ${{ matrix.connector.path }}

    steps:
      - uses: actions/checkout@v4
        # TODO: pin to SHA — replace @v4 with @<sha> once the repo is on GitHub
        # Find the SHA at: https://github.com/actions/checkout/releases

      - uses: actions/setup-node@v4
        # TODO: pin to SHA — https://github.com/actions/setup-node/releases
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Coverage summary
        run: |
          node -e "
            const s = require('./coverage/coverage-summary.json');
            const pct = v => v.pct + '%';
            const rows = Object.entries(s).map(([file, d]) => {
              const name = file === 'total' ? '**Total**' : file.split('/').pop();
              return \`| \${name} | \${pct(d.statements)} | \${pct(d.branches)} | \${pct(d.functions)} | \${pct(d.lines)} |\`;
            });
            const table = [
              '## Coverage — ${{ matrix.connector.name }}',
              '',
              '| File | Statements | Branches | Functions | Lines |',
              '|---|---|---|---|---|',
              ...rows,
            ].join('\n');
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, table);
          "

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        # TODO: pin to SHA — https://github.com/actions/upload-artifact/releases
        with:
          name: coverage-report-${{ matrix.connector.slug }}
          path: ${{ matrix.connector.path }}/coverage/
          retention-days: 30

      - name: Build
        run: npm run build

  modules:
    name: "${{ matrix.connector }} — terraform fmt / validate"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        connector: [aws-s3, onedrive, r2, sharepoint]

    defaults:
      run:
        working-directory: ${{ matrix.connector }}

    steps:
      - uses: actions/checkout@v4
        # TODO: pin to SHA — see note on the functions job above.

      - uses: hashicorp/setup-terraform@v3
        # TODO: pin to SHA — https://github.com/hashicorp/setup-terraform/releases
        with:
          # Must be >= 1.11: the modules use write-only arguments to keep
          # customer secrets out of state. An older Terraform cannot parse them.
          terraform_version: 1.11.0
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -diff -recursive .

      # -backend=false: we are validating module syntax against real provider
      # schemas, not connecting to any state. No cloud credentials are needed
      # and none are configured for this job.
      - name: Init (providers only)
        run: terraform init -backend=false -input=false

      # This is the step that catches provider drift. A module can sit valid for
      # months and then break because a provider major/minor removed or renamed
      # a resource, while the version constraint still happily resolves it. That
      # failure would otherwise surface for the first time in a customer's
      # terminal, mid-deployment.
      - name: Validate
        run: terraform validate
